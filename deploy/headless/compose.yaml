# Self-contained AnkiNote stack with the in-process Anki collection backend.
# No Anki desktop app and no AnkiConnect: AnkiNote keeps its own collection in
# the anki-data volume and syncs it straight with AnkiWeb.
#
#   cd deploy/headless
#   cp .env.example .env             # optional: AnkiWeb login, port, image tag
#   docker compose up -d             # http://localhost:8080
#
# ANKIWEB_USERNAME / ANKIWEB_PASSWORD are optional: leave them blank and sign
# in to AnkiWeb in the app instead. A brand-new collection cannot save cards until
# its first AnkiWeb sync finishes.

services:
  ankinote:
    image: ${ANKINOTE_IMAGE:-ghcr.io/ankinote-ai/ankinote:latest}
    # Build from a PyPI release instead of pulling:
    #   ANKINOTE_VERSION=1.1.0 docker compose build
    # build:
    #   context: ../..
    #   args:
    #     ANKINOTE_VERSION: ${ANKINOTE_VERSION:?set ANKINOTE_VERSION}
    ports:
      # Change via ANKINOTE_PUBLISH in .env. AnkiNote has no login, so keep it
      # on 127.0.0.1 unless deploy/README.md says otherwise for your setup.
      - "${ANKINOTE_PUBLISH:-127.0.0.1:8080}:8080"
    env_file:
      # ANKIWEB_USERNAME / ANKIWEB_PASSWORD are read from here when present.
      - path: .env
        required: false
    environment:
      ANKI_BACKEND: collection
      ANKI_COLLECTION_PATH: /data/collection.anki2
    volumes:
      # Settings and API keys entered in the app.
      - ankinote-config:/config
      # The Anki collection, media, sync state, and pre-full-sync backups.
      # Or bring your own collection directory instead of the named volume:
      #   - ./anki-data:/data
      - anki-data:/data
    restart: unless-stopped

volumes:
  ankinote-config:
  anki-data:
