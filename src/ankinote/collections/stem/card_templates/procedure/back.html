{{FrontSide}}
<section class="panel">
  {{#summary}}
  <div class="section-title">[[t:overview]]</div>
  <div class="brief">{{summary}}</div>
  {{/summary}}
  {{#steps}}
  <div class="section-title">[[t:steps]]</div>
  <div class="detail">{{steps}}</div>
  {{/steps}}
  {{#conditions}}
  <div class="section-title">[[t:conditions]]</div>
  <div class="detail">{{conditions}}</div>
  {{/conditions}}
  {{#image}}<div class="diagram-container">{{image}}</div>{{/image}}
  {{#Tags}}<div class="section-title">[[t:tags]]</div><div class="tags">{{Tags}}</div>{{/Tags}}
</section>
