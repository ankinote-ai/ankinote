{{FrontSide}}
<section class="panel">
  {{#answer}}
  <div class="section-title">[[t:answer]]</div>
  <div class="brief">{{answer}}</div>
  {{/answer}}
  {{#steps}}
  <div class="section-title">[[t:solution]]</div>
  <div class="detail">{{steps}}</div>
  {{/steps}}
  {{#explanation}}
  <div class="section-title">[[t:explanation]]</div>
  <div class="detail">{{explanation}}</div>
  {{/explanation}}
  {{#image}}<div class="diagram-container">{{image}}</div>{{/image}}
  {{#Tags}}<div class="section-title">[[t:tags]]</div><div class="tags">{{Tags}}</div>{{/Tags}}
</section>
